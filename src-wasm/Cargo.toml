[package]
name = "trainer-wasm"
version = "0.1.0"
description = "The Logic Proof Trainer's commands for the browser build"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
trainer-core = { path = "../trainer-core" }
wasm-bindgen = "=0.2.130"
serde_json = "1"
# Randomness and clocks for logic-core's ids and generators in the browser
getrandom = { version = "0.2", features = ["js"] }
uuid = { version = "1", features = ["v4", "js"] }
chrono = { version = "0.4", features = ["wasmbind"] }
